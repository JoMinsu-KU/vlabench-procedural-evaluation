   <g id="text_5">
    <text style="font: 8.5px 'DejaVu Sans'" transform="translate(529.581953 139.055728)">VLM-owned</text>
    <text style="font: 8.5px 'DejaVu Sans'" transform="translate(487.866875 148.573869)">Procedural phase, phase order,</text>
