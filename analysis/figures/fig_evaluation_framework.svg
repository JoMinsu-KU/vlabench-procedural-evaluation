   </g>
   <g id="text_6">
    <text style="font: 8.5px 'DejaVu Sans'" transform="translate(126.102109 232.086798)">Expert-DAG sequence scoring</text>
    <text style="font: 8.5px 'DejaVu Sans'" transform="translate(109.811328 241.604939)">Type-normalized PM-based full-match</text>
   </g>
   <g id="text_7">
    <text style="font: 8.5px 'DejaVu Sans'" transform="translate(491.359844 232.086798)">Reference-contract validation</text>
    <text style="font: 8.5px 'DejaVu Sans'" transform="translate(454.135156 241.604939)">No insertion, reordering, or target replacement</text>
   </g>
   <g id="text_8">
    <text style="font: 8.5px 'DejaVu Sans'" transform="translate(281.813867 333.254128)">Fixed native backend for accepted B plans</text>
    <text style="font: 8.5px 'DejaVu Sans'" transform="translate(230.837773 342.772269)">Backend-owned: pose, orientation, motion parameters, trajectory,</text>
    <text style="font: 8.5px 'DejaVu Sans'" transform="translate(241.423594 352.290409)">gripper/joint control, MuJoCo rollout and final-condition check</text>
   </g>
